name: AgentBuddyMac
options:
  bundleIdPrefix: com.vxider.agentbuddy
  createIntermediateGroups: true
  xcodeVersion: "16.0"
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${CODEX_DEVELOPMENT_TEAM}
    GENERATE_INFOPLIST_FILE: NO
targets:
  AgentBuddyMenuBar:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: AgentBuddyMenuBar
    settings:
      base:
        PRODUCT_NAME: AgentBuddy
        PRODUCT_BUNDLE_IDENTIFIER: com.vxider.agentbuddy.macos
        INFOPLIST_FILE: AgentBuddyMenuBar/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  AgentBuddyMenuBar:
    build:
      targets:
        AgentBuddyMenuBar: all
    run:
      config: Debug
      executable: AgentBuddyMenuBar
    archive:
      config: Release
