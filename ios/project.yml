name: AgentBuddy
options:
  bundleIdPrefix: com.vxider.agentbuddy
  createIntermediateGroups: true
  xcodeVersion: "16.0"
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${CODEX_DEVELOPMENT_TEAM}
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
configs:
  Debug: debug
  Release: release
targets:
  AgentBuddyPhone:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AppCore
      - path: PhoneApp
    settings:
      base:
        PRODUCT_NAME: AgentBuddy
        PRODUCT_BUNDLE_IDENTIFIER: com.vxider.agentbuddy.phone
        INFOPLIST_FILE: PhoneApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: PhoneApp/AgentBuddyPhone.entitlements
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: AgentBuddyWatchApp
        embed: true
    scheme:
      gatherCoverageData: false
      testTargets: []

  AgentBuddyWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: AppCore
      - path: WatchApp
    settings:
      base:
        PRODUCT_NAME: AgentBuddy Watch
        PRODUCT_BUNDLE_IDENTIFIER: com.vxider.agentbuddy.phone.watchapp
        INFOPLIST_FILE: WatchApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: WatchApp/AgentBuddyWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        WK_COMPANION_APP_BUNDLE_IDENTIFIER: com.vxider.agentbuddy.phone
    dependencies:
      - target: AgentStatusWidget
        embed: true

  AgentStatusWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: AppCore
      - path: WatchWidget
    settings:
      base:
        PRODUCT_NAME: AgentStatusWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.vxider.agentbuddy.phone.watchapp.widget
        INFOPLIST_FILE: WatchWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: WatchWidget/AgentBuddyWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  AgentBuddy:
    build:
      targets:
        AgentBuddyPhone: all
        AgentBuddyWatchApp: all
        AgentStatusWidget: all
    run:
      config: Debug
      executable: AgentBuddyPhone
    archive:
      config: Release
