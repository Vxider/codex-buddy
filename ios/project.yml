name: CodexBuddy
options:
  bundleIdPrefix: com.vxider.codexbuddy
  createIntermediateGroups: true
  xcodeVersion: "16.0"
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
configs:
  Debug: debug
  Release: release
targets:
  CodexBuddyPhone:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AppCore
      - path: PhoneApp
    settings:
      base:
        PRODUCT_NAME: CodexBuddy
        PRODUCT_BUNDLE_IDENTIFIER: com.vxider.codexbuddy.phone
        INFOPLIST_FILE: PhoneApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: PhoneApp/CodexBuddyPhone.entitlements
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - target: CodexBuddyWatchApp
        embed: true
    scheme:
      gatherCoverageData: false
      testTargets: []

  CodexBuddyWatchApp:
    type: application.watchapp2
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: AppCore
      - path: WatchApp
    settings:
      base:
        PRODUCT_NAME: CodexBuddy Watch
        PRODUCT_BUNDLE_IDENTIFIER: com.vxider.codexbuddy.watchapp
        INFOPLIST_FILE: WatchApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: WatchApp/CodexBuddyWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        WK_COMPANION_APP_BUNDLE_IDENTIFIER: com.vxider.codexbuddy.phone
    dependencies:
      - target: CodexStatusWidget
        embed: true

  CodexStatusWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: AppCore
      - path: WatchWidget
    settings:
      base:
        PRODUCT_NAME: CodexStatusWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.vxider.codexbuddy.widget
        INFOPLIST_FILE: WatchWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: WatchWidget/CodexBuddyWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  CodexBuddy:
    build:
      targets:
        CodexBuddyPhone: all
        CodexBuddyWatchApp: all
        CodexStatusWidget: all
    run:
      config: Debug
      executable: CodexBuddyPhone
    archive:
      config: Release
