# Add this block to ~/.codex/config.toml.

# BEGIN agent-buddy hooks
[[hooks.SessionStart]]
matcher = "startup|resume"
hooks = [{ type = "command", command = "~/.local/bin/agent-buddy hook session-start --config ~/.config/agent-buddy/config.json", statusMessage = "agent-buddy session-start" }]

[[hooks.UserPromptSubmit]]
hooks = [{ type = "command", command = "~/.local/bin/agent-buddy hook user-prompt-submit --config ~/.config/agent-buddy/config.json" }]

[[hooks.PreToolUse]]
matcher = "Bash"
hooks = [{ type = "command", command = "~/.local/bin/agent-buddy hook pre-tool-use --config ~/.config/agent-buddy/config.json" }]

[[hooks.PermissionRequest]]
hooks = [{ type = "command", command = "~/.local/bin/agent-buddy hook permission-request --config ~/.config/agent-buddy/config.json", statusMessage = "agent-buddy permission-request" }]

[[hooks.PostToolUse]]
matcher = "Bash"
hooks = [{ type = "command", command = "~/.local/bin/agent-buddy hook post-tool-use --config ~/.config/agent-buddy/config.json" }]

[[hooks.Stop]]
hooks = [{ type = "command", command = "~/.local/bin/agent-buddy hook stop --config ~/.config/agent-buddy/config.json" }]
# END agent-buddy hooks
